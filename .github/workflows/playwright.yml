name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: true

    - name: 🤖 Autonomous Self-Healing QA Agent
      if: failure()
      uses: jeswnath/Agents@main
      env:
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
        UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        teams-webhook: ${{ secrets.TEAMS_WEBHOOK_URL }}

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: 🌐 Deploy Live Playwright HTML Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: ${{ !cancelled() }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: 📢 Display Live Report Link in Run Summary
      if: ${{ !cancelled() }}
      run: |
        echo "::notice title=🌐 Live Playwright Report Available::https://jeswnath.github.io/testPlaywright/"
        echo "## 🌐 Live Playwright Test Report" >> $GITHUB_STEP_SUMMARY
        echo "> 🚀 **[Click Here to Open the Live Interactive Playwright Report](https://jeswnath.github.io/testPlaywright/)**" >> $GITHUB_STEP_SUMMARY
        echo "> *(Includes full interactive Trace Viewer, Videos, and Step-by-Step Screenshots)*" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
