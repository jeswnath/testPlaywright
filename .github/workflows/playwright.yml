name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      test_spec:
        description: 'Select Test Spec to Run'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'tests/petstore.spec.ts'
          - 'tests/complex-e2e-order.spec.ts'
          - 'tests/petstore-broken.spec.ts'

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Jpetstore-Playwright-Tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      id: playwright
      continue-on-error: true
      run: |
        ARGS=()
        if [ -n "${{ inputs.test_spec }}" ] && [ "${{ inputs.test_spec }}" != "all" ]; then
          ARGS+=("${{ inputs.test_spec }}")
        fi

        echo "▶ Executing: npx playwright test ${ARGS[@]}"
        npx playwright test "${ARGS[@]}" 2>&1 | tee playwright-output.log
        exit ${PIPESTATUS[0]}
      env:
        CI: true

    - name: Checkout agent definitions repo
      if: steps.playwright.outcome == 'failure'
      uses: actions/checkout@v4
      with:
        repository: jeswnath/Agents
        path: .agent-repo
        ref: main
        sparse-checkout: |
          .github/agents
          .github/skills

    - name: Install Copilot CLI
      if: steps.playwright.outcome == 'failure'
      run: npm install -g @github/copilot

    - name: Run centralized Copilot failure-analysis agent
      if: steps.playwright.outcome == 'failure'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        AGENT_FILE: .agent-repo/.github/agents/Self-Healing-QA.md
        SKILL_FILE: .agent-repo/.github/skills/self-healing-locator/SKILL.md
      run: |
        set -e

        if [ ! -f "$AGENT_FILE" ] || [ ! -f "$SKILL_FILE" ]; then
          echo "Missing agent definitions in the checked-out Agents repo."
          exit 1
        fi

        AGENT_TEXT=$(cat "$AGENT_FILE")
        SKILL_TEXT=$(cat "$SKILL_FILE")

        copilot \
          --agent=failure-analyzer \
          --prompt "Use the agent definitions below exactly.

          AGENT DEFINITION:
          $AGENT_TEXT

          SKILL PLAYBOOK:
          $SKILL_TEXT

          Analyze the log in playwright-output.log from the current repo. Identify the likely root cause, classify the failure, and write a concise report to failure-analysis.md. If the failure looks like a locator drift, recommend the best accessible Playwright locator to replace the broken one." \
          --allow-tool='shell(cat:*)' \
          --allow-tool='shell(ls:*)' \
          --allow-tool='write' \
          -s

    - name: Add failure analysis to workflow summary
      if: steps.playwright.outcome == 'failure'
      run: |
        if [ -f failure-analysis.md ]; then
          cat failure-analysis.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Mark workflow failed if tests failed
      if: steps.playwright.outcome == 'failure'
      run: exit 1

    - name: 🌐 Live Playwright Report (https://jeswnath.github.io/testPlaywright/)
      if: ${{ !cancelled() }}
      run: |
        if [ -d "playwright-report" ]; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          CLONE_DIR=$(mktemp -d)
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$CLONE_DIR" 2>/dev/null || {
            mkdir -p "$CLONE_DIR"
            git -C "$CLONE_DIR" init -b gh-pages
            git -C "$CLONE_DIR" remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          }
          
          rm -rf "$CLONE_DIR"/*
          cp -r playwright-report/* "$CLONE_DIR/"
          touch "$CLONE_DIR/.nojekyll"
          
          git -C "$CLONE_DIR" add -A
          git -C "$CLONE_DIR" commit -m "deploy: update live Playwright HTML report [skip ci]" --quiet || true
          git -C "$CLONE_DIR" push -f origin gh-pages --quiet
          rm -rf "$CLONE_DIR"
        fi
        
        echo "::notice title=🌐 Live Playwright Report::https://jeswnath.github.io/testPlaywright/"
        echo "## 🌐 Live Playwright Test Report" >> $GITHUB_STEP_SUMMARY
        echo "> 🚀 **[Click Here to Open the Live Playwright HTML Report](https://jeswnath.github.io/testPlaywright/)**" >> $GITHUB_STEP_SUMMARY
        echo "> *(Includes full interactive Trace Viewer, Videos, and Step-by-Step Screenshots)*" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo ""
        echo "================================================================================"
        echo "🌐 LIVE PLAYWRIGHT REPORT: https://jeswnath.github.io/testPlaywright/"
        echo "================================================================================"
        echo "✅ Report published cleanly to GitHub Pages."
