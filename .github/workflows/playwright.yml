name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: true

    - name: 🤖 Autonomous Self-Healing QA Agent
      if: failure()
      uses: jeswnath/Agents@main
      env:
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
        UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        teams-webhook: ${{ secrets.TEAMS_WEBHOOK_URL }}

    - name: 🌐 Live Playwright Report (https://jeswnath.github.io/testPlaywright/)
      if: ${{ !cancelled() }}
      run: |
        if [ -d "playwright-report" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TEMP_PAGES=$(mktemp -d)
          cp -r playwright-report/* "$TEMP_PAGES/"
          touch "$TEMP_PAGES/.nojekyll"
          
          git checkout --orphan gh-pages-temp 2>/dev/null || git checkout -B gh-pages-temp
          git rm -rf . >/dev/null 2>&1 || true
          cp -r "$TEMP_PAGES"/* .
          rm -rf "$TEMP_PAGES"
          
          git add -A
          git commit -m "deploy: update live Playwright HTML report [skip ci]" --quiet
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-temp:gh-pages --quiet
          git checkout -f -
        fi
        
        echo "::notice title=🌐 Live Playwright Report::https://jeswnath.github.io/testPlaywright/"
        echo "## 🌐 Live Playwright Test Report" >> $GITHUB_STEP_SUMMARY
        echo "> 🚀 **[Click Here to Open the Live Playwright HTML Report](https://jeswnath.github.io/testPlaywright/)**" >> $GITHUB_STEP_SUMMARY
        echo "> *(Includes full interactive Trace Viewer, Videos, and Step-by-Step Screenshots)*" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo ""
        echo "================================================================================"
        echo "🌐 LIVE PLAYWRIGHT REPORT: https://jeswnath.github.io/testPlaywright/"
        echo "================================================================================"
        echo "✅ Report published cleanly to GitHub Pages."
